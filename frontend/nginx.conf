# Universal frontend server: contains no deployment-specific values. The
# URL prefix arrives at runtime via BASE_PATH (docker-entrypoint.d/
# 20-app-config.sh writes app-config.js), so the same image works under
# any base path. Assets, public files, the runtime config and the media
# volumes are served at ANY path depth, which is what makes the relative
# Vite base work on the per-conference slug pages.
server {
    listen 8000;
    root /usr/share/nginx/html;

    # SPA fallback: every non-file path serves the app document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config is per-deployment: never cached.
    location ~ ^/(?:.*/)?app-config\.js$ {
        rewrite ^ /app-config.js break;
        add_header Cache-Control "no-store";
    }

    # Uploaded media and collected backend static: mounted volumes.
    location ~ ^/(?:.*/)?media/(.*)$ {
        alias /data/media/$1;
    }
    location ~ ^/(?:.*/)?back-static/(.*)$ {
        alias /data/static/$1;
    }

    # Built assets at any depth.
    location ~ ^/(?:.*/)?assets/(.*)$ {
        alias /usr/share/nginx/html/assets/$1;
    }

    # Public files (favicons, manifest, robots.txt) at any depth. SPA routes
    # never contain a dot, so an extension match cannot shadow them.
    location ~ ^/(?:.*/)?([^/]+\.(?:ico|svg|png|json|txt|webmanifest))$ {
        rewrite ^.*/([^/]+)$ /$1 break;
    }
}
