pid /tmp/nginx.pid;
worker_processes  1;

#error_log stderr info;

events {
    worker_connections  2048;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log stdout;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;

        location /conference-demo/ {
            # "break" keeps the request in this location: without it, the
            # rewritten URI re-enters location matching, falls out of this
            # block and the try_files SPA fallback never runs (404 on
            # /conference-demo/<slug>/).
            rewrite ^/conference-demo/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }
        location /conference-demo/media/ {
            alias /data/media/;
            try_files $uri $uri/ /index.html;
        }
    }
}
