<style>
    :root {
        --primary: #074391;
        --secondary: #0065bd;
        --hover: #002672;
        --text: #1f2937;
        --muted: #5b6573;
        --border: #d9dee5;
        --error: #b42318;
        --error-bg: #fef3f2;
    }

    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: #f5f6f8;
    }

    .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
    }

    .panel {
        width: min(100%, 440px);
        padding: 36px 40px 30px;
        background: #fff;
        border: 1px solid var(--border);
        border-top: 5px solid var(--secondary);
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .eyebrow {
        margin: 0;
        color: var(--secondary);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    h1 {
        margin: 8px 0;
        color: var(--primary);
        font-family: "Metrophobic", "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.15;
        text-transform: uppercase;
    }

    .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
    }

    .button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--secondary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .button:hover {
        background: var(--hover);
    }

    .button:active {
        transform: translateY(1px);
    }

    .button:focus-visible,
    input:focus-visible,
    .back:focus-visible {
        outline: 3px solid rgba(0, 101, 189, 0.35);
        outline-offset: 2px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0 18px;
        color: #8a94a3;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    label {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fbfcfd;
        color: var(--text);
        font: inherit;
        font-size: 16px;
        transition: background-color 0.2s ease, border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    input:hover {
        border-color: #b6c0cc;
    }

    input:focus {
        border-color: var(--secondary);
        background: #fff;
        box-shadow: 0 0 0 3px rgba(0, 101, 189, 0.16);
        outline: none;
    }

    .alert {
        padding: 12px 14px;
        border-left: 4px solid var(--error);
        border-radius: 6px;
        background: var(--error-bg);
        color: var(--error);
        font-size: 14px;
        line-height: 1.45;
    }

    .errorlist {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--error);
        font-size: 13px;
    }

    .alert .errorlist {
        margin: 0;
    }

    .back {
        display: inline-block;
        margin-top: 24px;
        color: var(--secondary);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
    }

    .back:hover {
        color: var(--hover);
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .page {
            padding: 18px 14px;
        }

        .panel {
            padding: 28px 22px 24px;
            border-radius: 14px;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
