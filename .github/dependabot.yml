# Dependabot configuration for this repository.
#
# Dependabot has three independent features: alerts, security updates, and version updates.
# Alerts and security updates are switched on/off in the repository settings
# (Security and quality -> Advanced Security), this file is not the on/off switch for them.
# However, this file does also govern security updates:
# for a matching ecosystem entry, `directory`, `ignore`, and `groups` (including `applies-to: security-updates`)
# all apply - as long as `directory` points at the manifest files and no `target-branch` is set.
# `open-pull-requests-limit` caps version updates only, security updates are never capped by it.
#
# Defaults are intentional: version updates cover direct dependencies only
# (the manifests), while security updates cover the whole lockfile. No
# `allow` or `update-types` rules are used, so both keep their default scope.
#
# Commit convention matches the existing history and AGENTS.md (Conventional Commits):
# a `build` type with a `deps` / `deps-dev` scope, e.g.
#   build(deps): Bump postcss from 8.5.6 to 8.5.29 in /frontend
#
# References:
# - Options reference:
#   https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# - Version updates:
#   https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-version-updates
# - Security updates:
#   https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-security-updates
# - Supported ecosystems:
#   https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
version: 2
updates:
  # Backend: uv-managed Python (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Minor + patch together; major bumps stay as individual PRs.
      # NOTE: groups.dependency-type is not supported for the uv ecosystem,
      # so production/dev are grouped by update type only.
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend: npm (package-lock.json).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      frontend-production:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-development:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Backend container base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      backend-docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend container base images
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      frontend-docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows.
  # The directory must be "/" for this ecosystem, Dependabot then scans .github/workflows and root action files.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
